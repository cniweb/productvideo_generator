name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      project-name: productvideo
      compile-targets: productvideo_generator.py
      coverage-targets: --cov=productvideo_generator
