name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.6.8

      - name: Static import sanity check
        run: |
          python - <<'PY'
          import importlib
          deps = [
              'google.genai',
              'pytrends',
              'dotenv',
              'pytest',
          ]
          for dep in deps:
              try:
                  importlib.import_module(dep)
              except Exception as exc:
                  raise SystemExit(f"Import failed for {dep}: {exc}")
          PY

      - name: Ruff lint
        run: ruff check productvideo_generator.py tests/

      - name: Byte-compile python
        run: python -m compileall productvideo_generator.py

      - name: Run pytest with coverage
        run: >-
          pytest -q
          --cov=productvideo_generator
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=40
          --junitxml=test-results.xml

      - name: Markdown lint
        run: python -m pymarkdown -c .pymarkdown.toml scan .

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: productvideo-reports-python-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore
